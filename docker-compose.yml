services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
    user: 1000:1000
    image: yt-dlp-application
    restart: always
    environment:
      - COMPOSER_CACHE_DIR=/tmp/composer-cache
    container_name: yt-dlp-application
    tty: true
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www
    networks:
      - yt-network
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - yt-network
networks:
  yt-network:
    driver: bridge